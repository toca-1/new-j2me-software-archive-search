# Deploy static content to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "missing_files/**"
      - "LICENSE"

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let in-progress deployments finish; keep only the latest queued run.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Run pre-deployment checks
        run: |
          python3 tests/check_repo.py
          node --check assets/app.js
          node --check assets/i18n.js
          node --test tests/app.test.cjs tests/mini_downloads.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/check_index.py
          python3 tools/check_folder_index.py --repo . --require-folders

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare site files
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='missing_files/' \
            --exclude='tests/' \
            --exclude='docs/' \
            --exclude='tools/' \
            --exclude='LICENSE' \
            --exclude='.gitignore' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            ./ "$RUNNER_TEMP/pages/"
          # Keep the standalone downloader public, but never publish build tools or docs.
          test -f "$RUNNER_TEMP/pages/index.html"
          test -f "$RUNNER_TEMP/pages/jarchive_download.py"
          test -d "$RUNNER_TEMP/pages/assets"
          test -d "$RUNNER_TEMP/pages/data"
          test ! -e "$RUNNER_TEMP/pages/tools"
          test ! -e "$RUNNER_TEMP/pages/docs"
          du -sh "$RUNNER_TEMP/pages"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
