# Deploy static content to GitHub Pages.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "DOWNLOADER.md"
      - "SOURCES.md"
      - "FUTURE_WORK.md"
      - "ATTRIBUTION.md"
      - "LICENSE"
      - "missing_files/**"

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let in-progress deployments finish; keep only the latest queued run.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site files
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='missing_files/' \
            ./ "$RUNNER_TEMP/pages/"
          du -sh "$RUNNER_TEMP/pages"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
